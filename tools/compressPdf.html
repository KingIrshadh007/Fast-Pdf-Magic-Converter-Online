<!DOCTYPE html>
<html>

<head>

<title>
Fast Magic PDF Compressor
</title>


<link rel="stylesheet" href="../css/compressPdf.css">


</head>


<body>


<div class="container">


<h1>
⚡ Compress PDF
</h1>


<div id="dropzone">


<h2>
Upload PDF
</h2>


<input
type="file"
id="pdfFile"
accept="application/pdf">


</div>



<br>


<select id="compressionLevel">


<option value="extreme">
🔥 Extreme (Maximum Compression)
</option>


<option value="high">
⚡ High
</option>


<option value="medium" selected>
⭐ Medium
</option>


<option value="low">
✨ Low (Best Quality)
</option>


</select>




<button id="compressBtn">

Compress PDF

</button>



<div id="status"></div>


<div id="result"></div>



</div>





<script src="../wasm/mupdf.js"></script>

<script src="../js/compressPdf.js"></script>


</body>

</html>
