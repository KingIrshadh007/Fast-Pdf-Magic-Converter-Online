<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Compress PDF - Fast Magic PDF
</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/compressPdf.css">


<!-- PDF Renderer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- PDF Creator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


</head>



<body>


<header class="site-header">


<div class="logo">

⚡ Fast Magic PDF

</div>



<nav>

<a href="../index.html">
Home
</a>


<a href="compressPdf.html">
Compress PDF
</a>

</nav>



<button id="themeToggle">

🌙 Dark Mode

</button>


</header>







<div class="page-wrapper">


<div class="container">


<h1>
Compress PDF
</h1>


<p class="tool-description">

Reduce PDF size while maintaining quality.

</p>








<div 
class="dropzone"
id="dropzone">


<h2>
📄 Upload PDF
</h2>


<p>
Drag & Drop PDF here
</p>


<span>
or click to browse
</span>



<input

type="file"

id="pdfFile"

accept="application/pdf"

hidden>


</div>







<div 
id="fileInfo"
class="file-info">

</div>







<div class="compression-settings">


<label>
Compression Quality
</label>


<select id="compressionLevel">


<option value="extreme">

🔥 Extreme Compression

</option>


<option value="high">

⚡ High Compression

</option>


<option value="medium" selected>

⭐ Medium Compression

</option>


<option value="low">

✨ Low Compression (Best Quality)

</option>


</select>


</div>







<button

id="compressBtn"

class="compress-btn">


Compress PDF


</button>







<div class="progress">


<div id="progressBar">

</div>


</div>



<p id="progressText">

</p>







<div id="compressionStats">

</div>







<div id="downloadArea">

</div>





</div>

</div>







<footer class="site-footer">

<p>

© 2026 Fast Magic PDF

</p>

</footer>







<script src="../js/compressPdf.js"></script>


</body>

</html>
