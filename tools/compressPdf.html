<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compress PDF - Fast Magic PDF</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/compressPdf.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


</head>


<body>


<header class="site-header">

<div class="logo">
⚡ Fast Magic PDF
</div>


<a href="../index.html">
Home
</a>


</header>




<div class="container">


<h1>
Compress PDF
</h1>


<p>
Reduce PDF size while keeping quality.
</p>



<div class="dropzone" id="dropzone">


<h2>
📄 Upload PDF
</h2>


<p>
Drag and drop PDF here
</p>


<span>
Click to select
</span>


<input
type="file"
id="pdfFile"
accept="application/pdf"
hidden>


</div>




<div id="fileInfo" class="file-info">

</div>





<div class="settings">


<label>
Compression Level
</label>


<select id="compressionLevel">

<option value="extreme">
Extreme
</option>


<option value="high">
High
</option>


<option value="medium" selected>
Medium
</option>


<option value="low">
Low
</option>


</select>


</div>





<button id="compressBtn">

Compress PDF

</button>





<div class="progress">

<div id="progressBar">

</div>

</div>



<p id="progressText"></p>




<div id="compressionStats">

</div>



<div id="downloadArea">

</div>



</div>





<script src="../js/compressPdf.js"></script>


</body>

</html>
