</title>


<link rel="stylesheet" href="../css/style.css">

<header class="site-header">


<div class="logo">

<nav>

<button id="themeToggle">
🌙 Dark Mode
</button>


</header>





<div class="page-wrapper">


<div class="container">


<h1>
Delete PDF Pages
</h1>



<p class="tool-description">

Remove unwanted pages from your PDF instantly.

</p>







<div 
class="delete-dropzone"
id="dropzone">


<h2>
📄 Upload PDF
</h2>


<p>
Drag & Drop PDF here
</p>


<span>
or click to browse
</span>



<input
type="file"
id="pdfFile"
accept="application/pdf"
hidden
>


</div>







<div id="pdfInfo"
class="pdf-info">

</div>







<h3>
Select Pages To Delete
</h3>



<div id="pageList">

</div>







<button
id="deleteBtn"
class="delete-btn">

Delete Selected Pages

</button>







<div class="progress-container">

<div id="progressBar">

</div>

</div>







<p id="status">

</p>







<div id="downloadArea">

</div>




</div>

</div>
