<link rel="stylesheet" href="../css/style.css">

<header class="site-header">

</button>

<div class="page-wrapper">


<div class="container">


<h1>
Merge PDF Online
</h1>


<p class="tool-description">

Combine multiple PDF files into one document quickly.

</p>




<div 
class="merge-dropzone"
id="dropzone">


<h2>
📄 Upload PDF Files
</h2>


<p>
Drag & Drop multiple PDFs here
</p>


<span>
or click to browse
</span>


<input 
type="file"
id="pdfFiles"
accept="application/pdf"
multiple
hidden
>

<div id="fileList">

</div>





<div class="merge-actions">


<button 
id="mergeBtn"
class="merge-btn">

Merge PDF

</button>

id="clearBtn"
class="clear-btn">

Clear All

</button>


</div>





<div class="progress-container">


<div 
id="progressBar">

</div>


</div>



<p id="status">

</p>

</div>
