<html lang="en">

<head>

<meta charset="UTF-8">

<title>
Protect PDF - Fast Magic PDF
</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/protectPdf.css">


<!-- ZIP Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>


</head>


<body>


<header class="site-header">


<div class="logo">

⚡ Fast Magic PDF

</div>



<nav>

<a href="../index.html">
Home
</a>


<a href="protectPdf.html">
Protect PDF
</a>


</nav>


<button id="themeToggle">

🌙 Dark Mode

</button>


</header>







<div class="page-wrapper">


<div class="container">


<h1>
Protect PDF With Password
</h1>



<p class="tool-description">

Create a password protected ZIP containing your PDF.

</p>







<div class="protect-dropzone" id="dropzone">


<h2>
📄 Upload PDF
</h2>


<p>
Drag & Drop PDF here
</p>


<span>
or click to browse
</span>



<input

type="file"

id="pdfFile"

accept="application/pdf"

hidden

>


</div>







<div id="fileInfo" class="file-info">

</div>







<div class="password-box">


<label>
Enter Password
</label>


<input

type="password"

id="pdfPassword"

placeholder="Enter password"

>


</div>







<button

class="protect-btn"

onclick="protectPDF()">

Protect PDF

</button>







<p id="status">

</p>







<div id="downloadArea">

</div>





</div>

</div>







<footer class="site-footer">

<p>

© 2026 Fast Magic PDF

</p>

</footer>
