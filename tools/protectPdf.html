<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Protect PDF Online - Fast Magic PDF
</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/protectPdf.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


</head>


<body>


<header class="site-header">


<div class="logo">
⚡ Fast Magic PDF
</div>


<nav>

<a href="../index.html">
Home
</a>


<a href="protectPdf.html">
Protect PDF
</a>


</nav>


<button id="themeToggle">
🌙 Dark Mode
</button>


</header>





<div class="page-wrapper">


<div class="container">


<h1>
Protect PDF With Password
</h1>



<p class="tool-description">

Secure your PDF document with password protection.

</p>







<div 
class="protect-dropzone"
id="dropzone">


<h2>
🔒 Upload PDF
</h2>


<p>
Drag & Drop PDF here
</p>


<span>
or click to browse
</span>



<input
type="file"
id="pdfFile"
accept="application/pdf"
hidden
>


</div>







<div 
id="pdfInfo"
class="pdf-info">

</div>







<div class="password-box">


<label>
Enter Password
</label>


<input
type="password"
id="pdfPassword"
placeholder="Enter password"
>


</div>







<button 
id="protectBtn"
class="protect-btn">

Protect PDF

</button>







<div class="progress-container">

<div id="progressBar">

</div>

</div>







<p id="status">

</p>





<div id="downloadArea">

</div>





</div>

</div>






<footer class="site-footer">


<p>
© 2026 Fast Magic PDF
</p>


</footer>





<script src="../js/protectPdf.js"></script>


</body>

</html>
