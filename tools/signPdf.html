<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Sign PDF - Fast Magic PDF
</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/signPdf.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


</head>


<body>


<header class="site-header">


<div class="logo">

⚡ Fast Magic PDF

</div>



<nav>

<a href="../index.html">
Home
</a>


<a href="signPdf.html">
Sign PDF
</a>


</nav>


<button id="themeToggle">
🌙 Dark Mode
</button>


</header>





<div class="page-wrapper">


<div class="container">


<h1>
Sign PDF Online
</h1>



<p class="tool-description">

Add your signature to PDF documents.

</p>







<div 
class="sign-dropzone"
id="dropzone">


<h2>
📄 Upload PDF
</h2>


<p>
Drag & Drop PDF here
</p>


<span>
or click to browse
</span>



<input
type="file"
id="pdfFile"
accept="application/pdf"
hidden
>


</div>







<div id="pdfInfo"
class="pdf-info">

</div>








<h3>
Draw Your Signature
</h3>


<canvas 
id="signaturePad"
width="500"
height="200">
</canvas>



<button 
id="clearBtn"
class="clear-btn">

Clear Signature

</button>








<button
id="signBtn"
class="sign-btn">

Sign PDF

</button>








<div class="progress-container">

<div id="progressBar">

</div>

</div>







<p id="status">

</p>







<div id="downloadArea">

</div>






</div>

</div>






<footer class="site-footer">

<p>
© 2026 Fast Magic PDF
</p>

</footer>





<script src="../js/signPdf.js"></script>


</body>

</html>
