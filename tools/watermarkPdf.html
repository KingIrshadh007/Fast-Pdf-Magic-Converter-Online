<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Watermark PDF - Fast Magic PDF
</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/watermarkPdf.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


</head>


<body>


<header class="site-header">


<div class="logo">
⚡ Fast Magic PDF
</div>


<nav>

<a href="../index.html">
Home
</a>


<a href="watermarkPdf.html">
Watermark PDF
</a>


</nav>


<button id="themeToggle">
🌙 Dark Mode
</button>


</header>





<div class="page-wrapper">


<div class="container">


<h1>
Watermark PDF
</h1>


<p class="tool-description">

Add text watermark to all PDF pages.

</p>






<div 
class="watermark-dropzone"
id="dropzone">


<h2>
📄 Upload PDF
</h2>


<p>
Drag & Drop PDF here
</p>


<span>
or click to browse
</span>


<input
type="file"
id="pdfFile"
accept="application/pdf"
hidden
>


</div>






<div 
id="pdfInfo"
class="pdf-info">

</div>







<div class="settings">


<label>
Watermark Text
</label>


<input
type="text"
id="watermarkText"
value="Fast Magic PDF"
placeholder="Enter watermark text"
>



<label>
Font Size
</label>


<input
type="number"
id="fontSize"
value="40"
min="10"
max="100"
>



<label>
Opacity
</label>


<input
type="range"
id="opacity"
min="0.1"
max="1"
step="0.1"
value="0.3"
>


</div>







<button
id="watermarkBtn"
class="watermark-btn">

Add Watermark

</button>







<div class="progress-container">

<div id="progressBar">

</div>

</div>






<p id="status">

</p>





<div id="downloadArea">

</div>





</div>

</div>






<footer class="site-footer">


<p>
© 2026 Fast Magic PDF
</p>


</footer>





<script src="../js/watermarkPdf.js"></script>


</body>

</html>
